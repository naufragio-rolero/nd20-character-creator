    // Pages admite /characters/; proxies de archivos necesitan /characters/index.html.
    (function(){
      'use strict';
      var actual=new URL(window.location.href);
      var explicito=actual.pathname.endsWith('/index.html');
      var destino=new URL('../characters/'+(explicito?'index.html':''),actual);
      destino.search=actual.search;
      destino.hash=actual.hash;
      window.location.replace(destino.href);
    })();
  </script>
