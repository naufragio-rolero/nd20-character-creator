name: Limpieza temporal de ramas integradas (autoriza usuario)
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/limpieza-ramas-temporal.yml
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: limpieza-ramas-temporal
  cancel-in-progress: false
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Comparar y borrar únicamente 16 ramas 100% integradas
        uses: actions/github-script@v7
        with:
          script: |
            const targets=[["docs/enciclopedia-inventario-2026-10-28","04c90c7e7d4914badbcc2a619a64f7c994b738c5"],["docs/forja-1-4-propiedades-drs-20261101","e2c8f406c8ea3038733b7527f75a04c1a46d6022"],["docs/fuentes-talentos-cinco-fases-2026-11-01","c005bd04ee46d35a76dc4fc5288ed44373fd2eea"],["docs/talentos-drs-resoluciones-autoriales-20261101","0b5be8107665a996350bad72755499493316bd44"],["feat/fases-talentos-drs-2026-11-01","613e91cb598f46c7288b07154c904abef4013648"],["feat/forja-1-2-rejilla-equipo-i18n","e676951b736e4990622622ce4cbe15f4e0c9618f"],["feat/forja-1-3-talentos-drs-popups","fa3a4449ed6d22d81e09084e2fd1c686a648df50"],["feat/forja-1-5-aclaraciones-autoriales-drs","25e10008c12f03014d3046f64807e3b744986717"],["feat/forja-conjuros-fichas-2026-10-30","bacad3ffe96b7d307c8bc33b79d8a9d0f1eedd0b"],["feat/forja-poderes-popup-compacto","31efd075c5d95dd15195044d503ecf1a31003819"],["feat/github-pages-multisistema","9b75a28246fc79cb8eaa768dee86c62cc285ccc3"],["feat/pills-equipo-escuelas-circulos-2026-11-01","810a74599032ac97c90eae5eb742a540e80bda94"],["feat/ux-accesibilidad-forja-1-1","ccc5258f5087e364745e1f73b202f21adce21561"],["fix/forja-1-3-1-auditoria-herencia-drs","222aa5b0637a7cfd4bbb73b4b2a9ab5238acbc2d"],["fix/forja-drs-fichas-accesibilidad-2026-11-01","eab265caf24d6a2a4c29ac12c07c65c4fdaef4a3"],["fix/forja-onboarding-boton-footer-2026-11-01","5c1d53b4b290984b31c898a9b622f039f1ac54dd"]];
            const {owner,repo}=context.repo;
            const [meta,openPRs]=await Promise.all([
              github.rest.repos.get({owner,repo}),
              github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100})
            ]);
            if(meta.data.default_branch!=='main')throw Error('La rama principal ha cambiado; limpieza cancelada.');
            const openHeads=new Set(openPRs.map(pr=>pr.head.ref));
            if(!openHeads.has('feat/forja-consulta-equipo-objetos-2026-11-01'))
              throw Error('No se encuentra la PR #13, conservar todas las referencias.');
            const deleted=[],skipped=[];
            for(const [branch,sha] of targets){
              if(branch==='main'||openHeads.has(branch)){skipped.push(branch+' (activa)');continue;}
              const ref='heads/'+branch;
              let current;
              try {current=await github.rest.git.getRef({owner,repo,ref});}
              catch(e){if(e.status===404){skipped.push(branch+' (ya eliminada)');continue;}throw e;}
              if(current.data.object.sha!==sha){skipped.push(branch+' (SHA cambió)');continue;}
              const [compare,info]=await Promise.all([
                github.rest.repos.compareCommits({owner,repo,base:'main',head:branch}),
                github.rest.repos.getBranch({owner,repo,branch})
              ]);
              if(compare.data.ahead_by!==0||
                 !['behind','identical'].includes(compare.data.status)||
                 info.data.protected){
                skipped.push(branch+' (no integrado o protegido)');continue;
              }
              await github.rest.git.deleteRef({owner,repo,ref});
              try {await github.rest.git.getRef({owner,repo,ref});
                   throw Error('El ref sigue existiendo después del borrado: '+branch);}
              catch(e){if(e.status!==404)throw e;}
              deleted.push(branch);
              core.info('ELIMINADA: '+branch);
            }
            core.info('RESUMEN: '+deleted.length+' eliminadas; '+skipped.length+' omitidas');
            for(const s of skipped)core.warning('OMITIDA: '+s);
            await core.summary.addHeading('Limpieza segura de ramas Forja')
            .addRaw('Eliminadas: '+deleted.length+' / '+targets.length)
            .addList(deleted).addRaw('Omitidas: '+skipped.join('; '))
            .write();
            if(skipped.some(x=>!x.includes('ya eliminada')))
              core.setFailed('Hay ramas no eliminadas que requieren revisión; no forzar.');
