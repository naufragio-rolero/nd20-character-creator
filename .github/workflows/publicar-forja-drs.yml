name: Publicar Forja DRS + Dungeon Hack (Pages seguro)

on:
  push:
    branches:
      - 'feat/forja-conjuros-fichas-2026-10-30'
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publicar-forja-drs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forja-drs-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/feat/forja-conjuros-fichas-2026-10-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Leer fuentes sin exponer la raiz
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Construir SOLO el paquete publico filtrado
        run: node scripts/crear-paquete-drs.js
      - name: Bloquear DLC y modos CiFi/Nocturna visibles
        run: node scripts/comprobar-publicacion-drs.js dist/public-drs
      - name: Comprobar fidelidad literal y lista blanca
        run: node tests/paquete-publico-drs.js
      - name: Probar Chrome contra archivos PUBLICOS
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/browser-compras.js
      - name: Preparar Firefox y WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps firefox webkit
      - name: Probar Firefox y WebKit contra archivos PUBLICOS
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/browser-compatibilidad.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir EXCLUSIVAMENTE dist/public-drs a Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public-drs
      - name: Publicar artefacto depurado
        id: deployment
        uses: actions/deploy-pages@v4
