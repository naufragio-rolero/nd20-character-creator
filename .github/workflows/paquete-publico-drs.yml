name: Forja - candidato publico DRS (sin despliegue)

on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paquete-drs:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar regresiones editoriales e iconografía consolidada
        run: |
          node tests/alcance-drs.js
          node tests/smoke.js
          node tests/semillas-rangos.js
          node tests/fichas-drs-ux.js
          node tests/armamento-edicion.js
          node tests/limites-compra-ux.js
          node tests/elecciones-poscreacion.js
          node tests/iconos-forja.js
      - name: Preparar activos locales PDF y fuentes con licencias
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1 \
            @expo-google-fonts/source-serif-4@0.4.1 playwright@1.56.1
          node scripts/preparar-vendor-pdf-a5.cjs
          node tests/pdf-a5-real.cjs
      - name: Construir paquete de lista blanca
        run: node scripts/crear-paquete-drs.js
      - name: Comprobar físicamente la ausencia de DLC
        run: node scripts/comprobar-publicacion-drs.js dist/public-drs
      - name: Comparar DRS y preservar CiFi, Nocturna y Dungeon Hack
        run: node tests/paquete-publico-drs.js
      - name: Recorrido de Chrome sobre los archivos PUBLICOS, no la raiz
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: |
          node tests/browser-compras.js
          node tests/browser-semillas-rangos.cjs chrome
      - name: Exportar PDF real de personaje DRS en Chrome (paquete)
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/pdf-a5-browser-e2e.cjs
      - name: Instalar motores de compatibilidad solo en CI
        run: |
          test -f node_modules/playwright/package.json
          npx playwright install --with-deps firefox webkit
      - name: Probar los archivos PUBLICOS en Firefox y WebKit
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: |
          node tests/browser-compatibilidad.js
          node tests/browser-semillas-rangos.cjs firefox webkit
      - name: Probar editor Nd20 sobre paquete DRS depurado
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/browser-criaturas.cjs
      - name: Exportar PDF real en Firefox y WebKit desde paquete
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/pdf-a5-multimotor.cjs
      - name: Conservar paquete candidato, nunca desplegar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forja-drs-candidato-no-publicado
          path: dist/public-drs/
          retention-days: 7
      - name: Evidencias E2E del paquete candidato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-drs-e2e-candidato
          path: |
            dist/public-drs/tests/capturas-e2e/
            dist/public-drs/tests/capturas-compatibilidad/
          if-no-files-found: ignore
          retention-days: 7
