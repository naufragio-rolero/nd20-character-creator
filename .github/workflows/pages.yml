name: Publicar Forja de personajes en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Validar los archivos estáticos
        shell: bash
        run: |
          test -s index.html
          test -s assets/rules.js
          test -s assets/app.js
          test -s assets/styles.css
          test -s data/dungeon-hack.json
          test -s data/especies.json
          test -s data/ocupaciones.json
          test -s data/especies_cifi.json
          test -s data/ocupaciones_cifi.json

      - name: Preparar publicación aislada
        shell: bash
        run: |
          mkdir -p site
          cp index.html .nojekyll site/
          cp -R assets data site/

      - name: Guardar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  desplegar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
