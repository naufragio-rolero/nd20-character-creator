name: Publicar Forja de personajes en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Validar los archivos estáticos
        shell: bash
        run: |
          test -s index.html
          test -s assets/rules.js
          test -s assets/app.js
          test -s assets/styles.css
          test -s data/dungeon-hack.json
          test -s data/especies.json
          test -s data/ocupaciones.json
          test -s data/especies_cifi.json
          test -s data/ocupaciones_cifi.json
          test -s data/catalogo-ampliado.json
          test -s data/catalogo-poderes.json
          test -s data/tesauro-ylat.json
          test -s data/progresiones-oficiales.json
          test -s data/equipo-inicial.json
          test -s assets/equipment.js
          node --check assets/equipment.js
          node --check assets/rules.js
          test -s assets/powers.js
          test -s control.html
          test -s assets/control-editor.js
          test -s assets/repertorios.js
          node --check assets/repertorios.js
          test -s assets/control-ui.js
          test -s assets/control.css
          node --check assets/powers.js
          node --check assets/app.js
          node --check assets/control-editor.js
          node --check assets/control-ui.js

      - name: Comprobar generadores y catálogos
        run: node tests/smoke.js

      - name: Preparar publicación aislada
        shell: bash
        run: |
          mkdir -p site
          cp index.html control.html .nojekyll site/
          cp -R assets data site/

      - name: Guardar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  desplegar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
