name: Forja LIVE — publicación segura DRS

# El punto de publicación se conserva en main. El código de Forja se
# promueve únicamente mediante un SHA revisado y probado: NO se despliega
# el árbol ni las fuentes inéditas del repositorio.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forja-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener exclusivamente Forja DRS validada (PR #18)
        uses: actions/checkout@v4
        with:
          ref: ba163f5144ec8e5f55073dea4b0cedcfbe72a78f
          persist-credentials: false
      - name: Comprobar la revisión exacta de la entrega
        run: |
          test "$(git rev-parse HEAD)" = "ba163f5144ec8e5f55073dea4b0cedcfbe72a78f"
      # DRS base PR #18 fijado. La PR #24 aporta las estadísticas
      # documentadas de equipo, la PR #25 los recursos y protecciones.
      # Esta revisión compacta sus tarjetas sin alterar las reglas del DRS.
      # Superponer solo archivos autorizados cotejados por SHA.
      - name: Aplicar mejoras DRS y Recursos compactos por SHA
        shell: bash
        run: |
          set -euo pipefail
          UI_COMMIT=1be9c07e2a8f7c1671e34a5a22c33034d284aba7
          archivos=(
            assets/app.js
            assets/styles.css
            assets/tooltips.js
            assets/tooltip-ui.js
            assets/icons-forja.svg
            assets/equipment.js
            index.html
            assets/rules.js
            assets/sex.js
            data/tesauro-ylat.json
            data/equipo-inicial.json
            scripts/crear-paquete-drs.js
            scripts/comprobar-publicacion-drs.js
            tests/browser-compras.js
            tests/browser-compatibilidad.js
            tests/fichas-drs-ux.js
            tests/paquete-publico-drs.js
            tests/alcance-drs.js
            tests/smoke.js
          )
          blobs=(
            2b4d2cdfdb19a9c541d9178337476f967d5ee250
            a3fcc0c59cd0ad002dc36dc635f1583132066749
            44556a29e7700beb17085298e61545aca023d784
            105de262dd5d81c283ac2cc1bd26e04068ea8a6f
            8bc37f3ed18a2af93faccd6dff108852d86105a1
            30e8e3b03d381afa328cdcc202a644c2b74d8e82
            9593337ee7b4779f8f06f62151e6905d1cd8124f
            7aced6a1728d60a69115190a38861f3bfabed0bd
            5840727b1c4b4b7a260ff425e596edca4ea6534f
            e21e0704d247d02a9930e28f0fd88bf307408d7e
            4dbf838ed85a8510a3ca1204de41bc981ac6046f
            59001f362a71505b07af35f0d65c215bd4f76647
            6d42c7947d900bc8f754593771840d442c61b184
            21a76d20eb5b002654b551df61ad64631c39a739
            cd473554a697bf764d8a4b513936aa6a48474b33
            70a61361e0fab3e107a47b81fa7ecc454686c306
            d9cf204932a38b31be22034465cbad55bd24b805
            551397fa923f6444b65725968214f7e3b2a030b7
            08bf54f92c0f226027779ba6baf06324c3954973
          )
          for i in "${!archivos[@]}"; do
            archivo="${archivos[$i]}"
            blob="${blobs[$i]}"
            curl --connect-timeout 10 --max-time 30 --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/naufragio-rolero/nd20-character-creator/${UI_COMMIT}/${archivo}" \
              -o "${archivo}"
            test "$(git hash-object "${archivo}")" = "${blob}"
          done
          # Todo cambio respecto al pin DRS debe estar en esta lista blanca.
          while IFS= read -r modificado; do
            autorizado=false
            for archivo in "${archivos[@]}"; do
              if [[ "${modificado}" == "${archivo}" ]]; then autorizado=true;break;fi
            done
            test "${autorizado}" = true
          done < <(git diff --name-only)
          grep -Fq "fonts.googleapis.com/css2?family=Exo" assets/styles.css
          grep -Fq "dialogo.showModal();" assets/app.js
          grep -Fq 'id="compras-grupo"' index.html
          grep -Fq 'id="ico-conjuro"' assets/icons-forja.svg
          grep -Fq 'id="ico-tecnica"' assets/icons-forja.svg
          ! grep -Fq 'Forma del generador histórico de nombres de Ylat.' assets/rules.js
          ! grep -Fq 'Nombre del banco histórico sin clasificación documental de sexo;' assets/sex.js
          grep -Fq "grupo==='talento'||grupo==='poder'||grupo==='equipo'" assets/app.js
          test "$(grep -c '"ambito": "Isla Tormenta"' data/tesauro-ylat.json)" -eq 52
          ! grep -Eiq 'niguac|niguaz' data/tesauro-ylat.json
          ! grep -Eiq 'niguac|niguaz' index.html
          ! grep -Eiq 'niguac|niguaz' assets/rules.js
          grep -Fq 'exactamente 33 combinaciones únicas' scripts/crear-paquete-drs.js
          grep -Fq 'function bloquesConjuroDRS(ficha)' assets/tooltips.js
          grep -Fq 'bloques_conjuro' assets/tooltip-ui.js
          grep -Fq '.info-tabla-conjuro{' assets/styles.css
          grep -Fq 'if(x.blindaje!=null)' assets/tooltips.js
          grep -Fq 'info.danioCompuesto?.dados_base' assets/tooltips.js
          grep -Fq '"blindaje": "d4"' data/equipo-inicial.json
          grep -Fq 'function blindajeFicha(personaje,catalogo)' assets/equipment.js
          grep -Fq 'class="recursos recursos-rejilla"' assets/app.js
          grep -Fq 'function iconoEquipo(nombre)' assets/app.js
          grep -Fq 'function descripcionConSexo(personaje)' assets/app.js
          grep -Fq 'function nombreEquipoVisible(nombre)' assets/app.js
          grep -Fq "var ordenAtributos=['Fuerza','Mente','Agilidad','Intuición','Resistencia','Presencia'];" assets/app.js
          grep -Fq "iluminacion:'Iluminación'" assets/app.js
          grep -Fq "ropa:'Ropa'" assets/app.js
          grep -Fq 'function claveEquipoDRS(nombre)' assets/tooltips.js
          grep -Fq '"id": "ropa-disfraz"' data/equipo-inicial.json
          grep -Fq '"id": "ropa-tunica"' data/equipo-inicial.json
          grep -Fq '"id": "iluminacion-antorcha"' data/equipo-inicial.json
          grep -Fq 'id="sexo-masculino"' assets/icons-forja.svg
          grep -Fq 'id="sexo-femenino"' assets/icons-forja.svg
          grep -Fq 'id="sexo-indeterminado"' assets/icons-forja.svg
          grep -Fq 'id="dialogo-configuracion"' index.html
          grep -Fq 'id="abrir-configuracion"' index.html
          grep -Fq 'id="ico-configurar"' assets/icons-forja.svg
          grep -Fq 'id="equipo-arco"' assets/icons-forja.svg
          grep -Fq "recurso-nota-escudo" assets/app.js
          grep -Fq "info-primarios-objeto" assets/tooltip-ui.js
          ! grep -Fq 'nth-child(5):last-child{grid-column:1/-1}' assets/styles.css
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr))' assets/styles.css
          grep -Fq 'function htmlProteccionesEquipadas(personaje,id)' assets/app.js
          grep -Fq 'id="recurso-blindaje"' assets/icons-forja.svg
          test "$(grep -c '<symbol id=' assets/icons-forja.svg)" -eq 34
          echo "OK: estadísticas oficiales, 64 Conjuros, Recursos y protecciones cotejados por hash."
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regresión editorial de nombres y esquema DRS
        run: |
          node tests/alcance-drs.js
          node tests/smoke.js
          node tests/fichas-drs-ux.js
      - name: Generar solo la carpeta DRS autorizada
        run: node scripts/crear-paquete-drs.js
      - name: Detener la publicación ante DLC o sistemas no autorizados
        run: node scripts/comprobar-publicacion-drs.js dist/public-drs
      - name: Auditar la distribución y sus textos de reglas
        run: node tests/paquete-publico-drs.js
      - name: Verificar interacción real de Chrome
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/browser-compras.js
      - name: Instalar Firefox y WebKit para verificar el sitio real
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps firefox webkit
      - name: Verificar la distribución en Firefox y WebKit
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/browser-compatibilidad.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir exclusivamente el paquete depurado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public-drs
      - name: Publicar Forja LIVE
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar el sitio público tras el despliegue
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          echo "Comprobando que Pages sirve la consulta DRS compacta desde SHA fijado"
          correcto=false
          for intento in $(seq 1 16); do
            if curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL}?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-live.html &&
               grep -Fq 'id="selector-visual-especie"' /tmp/forja-live.html &&
               grep -Fq 'id="generar-flotante"' /tmp/forja-live.html &&
               grep -Fq 'id="dialogo-configuracion"' /tmp/forja-live.html &&
               grep -Fq 'id="abrir-configuracion"' /tmp/forja-live.html &&
               grep -Fq 'id="informacion-avanzada"' /tmp/forja-live.html &&
               grep -Fq 'id="inicio-movil"' /tmp/forja-live.html &&
               grep -Fq 'class="empezar-forja"' /tmp/forja-live.html; then
              correcto=true
              break
            fi
            sleep 5
          done
          test "$correcto" = true
          ! grep -Fq 'data-juego="nd20_cifi"' /tmp/forja-live.html
          ! grep -Fq 'data-juego="nd20_nocturna"' /tmp/forja-live.html
          grep -Fq '<dialog id="editor-compras"' /tmp/forja-live.html
          grep -Fq 'id="compras-grupo"' /tmp/forja-live.html
          ! grep -Eiq 'niguac|niguaz' /tmp/forja-live.html
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/app.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-app.js
          # El CTA también se ofrece cuando la mesa no contiene fichas.
          grep -Fq "var mesaVacia=entradas.length===0;" /tmp/forja-app.js
          grep -Fq "configurador.showModal();" /tmp/forja-app.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/tooltip-ui.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-tooltip-ui.js
          grep -Fq "if(a&&e.pointerType===\"mouse\"&&!fija" /tmp/forja-tooltip-ui.js

          # Comprobar funciones de PR #17 y no solo la presencia de los JSON.
          grep -Fq "var avanzada=false,pulsacionReferencia=false;" /tmp/forja-tooltip-ui.js
          grep -Fq "var categoriaVisible=talento?.categoria||objeto?.categoria;" /tmp/forja-tooltip-ui.js
          grep -Fq "tecnicos.appendChild(nota);" /tmp/forja-tooltip-ui.js
          ! grep -Fq "En pocas palabras" /tmp/forja-tooltip-ui.js
          ! grep -Fq "Tipo de uso (guía editorial)" /tmp/forja-tooltip-ui.js
          ! grep -Fq "Leer texto íntegro del DRS" /tmp/forja-tooltip-ui.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/tooltips.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-tooltips.js
          grep -Fq "x.categoria_talento=g.categoria;" /tmp/forja-tooltips.js

          # Insignias nuevas en código servido, además de los 24 Talentos.
          grep -Fq "presentarEquipo:presentarEquipo" /tmp/forja-tooltips.js
          grep -Fq "function bloquesConjuroDRS(ficha)" /tmp/forja-tooltips.js
          grep -Fq 'if(x.blindaje!=null)' /tmp/forja-tooltips.js
          grep -Fq 'info.danioCompuesto?.dados_base' /tmp/forja-tooltips.js
          grep -Fq "info.bloques_conjuro" /tmp/forja-tooltip-ui.js
          grep -Fq 'info-primarios-objeto' /tmp/forja-tooltip-ui.js
          grep -Fq "escuelas:escuelas,circulo:circulo" /tmp/forja-tooltips.js
          grep -Fq "info-escuela-" /tmp/forja-tooltip-ui.js
          grep -Fq "info-circulo-valor" /tmp/forja-tooltip-ui.js
          grep -Fq "textoVisible===undefined?t:textoVisible" /tmp/forja-tooltip-ui.js
          grep -Fq "function presentarPoder(nombre)" /tmp/forja-app.js
          grep -Fq "ico-conjuro" /tmp/forja-app.js
          grep -Fq "grupo==='talento'||grupo==='poder'||grupo==='equipo'" /tmp/forja-app.js
          grep -Fq 'function htmlProteccionesEquipadas(personaje,id)' /tmp/forja-app.js
          grep -Fq 'class="recursos recursos-rejilla"' /tmp/forja-app.js
          grep -Fq 'function iconoEquipo(nombre)' /tmp/forja-app.js
          grep -Fq 'function descripcionConSexo(personaje)' /tmp/forja-app.js
          grep -Fq 'function nombreEquipoVisible(nombre)' /tmp/forja-app.js
          grep -Fq "var ordenAtributos=['Fuerza','Mente','Agilidad','Intuición','Resistencia','Presencia'];" /tmp/forja-app.js
          grep -Fq "iluminacion:'Iluminación'" /tmp/forja-app.js
          grep -Fq "ropa:'Ropa'" /tmp/forja-app.js
          grep -Fq "recurso-nota-escudo" /tmp/forja-app.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/equipment.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-equipment.js
          grep -Fq 'function blindajeFicha(personaje,catalogo)' /tmp/forja-equipment.js
          grep -Fq 'proteccionesDisponibles:proteccionesDisponibles' /tmp/forja-equipment.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/rules.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-rules.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/sex.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-sex.js
          ! grep -Fq 'Forma del generador histórico de nombres de Ylat.' /tmp/forja-rules.js
          ! grep -Fq 'Nombre del banco histórico sin clasificación documental de sexo;' /tmp/forja-sex.js
          ! grep -Eiq 'niguac|niguaz' /tmp/forja-rules.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/data/tesauro-ylat.json?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-ylat.json
          ! grep -Eiq 'niguac|niguaz' /tmp/forja-ylat.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const j=require('/tmp/forja-ylat.json');
          assert.equal(j.entradas.length,33);
          assert.ok(j.entradas.every(x=>x.tipo==='combinado'&&x.ambito==='Isla Tormenta'));
          console.log('OK: cero registros externos; solo 33 variantes aprobadas de Ylat.');
          NODE
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/data/equipo-inicial.json?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-equipo.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const e=require('/tmp/forja-equipo.json');
          assert.deepEqual([e.armas.length,e.armaduras.length,e.escudos.length,e.varitas_defensa.length],
            [38,14,3,4]);
          const buscar=(familia,nombre)=>e[familia].find(x=>x.nombre===nombre);
          const tela=buscar('armaduras','Armadura de tela');
          const pieles=buscar('armaduras','Armadura de pieles');
          const varita=buscar('varitas_defensa','Varita de cerezo');
          const daga=buscar('armas','Daga');
          assert.deepEqual([tela.blindaje,tela.durabilidad],['d4','-']);
          assert.deepEqual([pieles.blindaje,pieles.durabilidad],['d6','d6']);
          assert.deepEqual([varita.dano,varita.durabilidad,varita.municion_du],['1d3','d4','d6']);
          assert.deepEqual([daga.dano,daga.penetracion,daga.durabilidad],['1d4',1,'d8']);
          assert.deepEqual(e.utiles_fantasia.iluminacion.map(x=>[x.nombre,x.precio,x.du]),[
            ['Antorcha',0.1,'d6'],['Lámpara de aceite',2,'d6 (aceite)'],
            ['Linterna',10,'d6 (aceite)'],['Vela',0.01,'d4']
          ]);
          assert.deepEqual(e.utiles_fantasia.ropa.map(x=>[x.nombre,x.precio]),[
            ['Abrigo de piel',20],['Atuendo de noble',30],
            ['Chaqueta de cuero',10],['Disfraz',5],
            ['Traje elegante',15],['Túnica',1]
          ]);
          assert.equal(e.utiles_fantasia.ropa.some(x=>x.nombre==='Ropa de viaje'),false);
          console.log('OK: atributos literales DRS de armas, varitas y armaduras en LIVE.');
          NODE
          ! grep -Fq "fuenteGlosa.textContent='Descripción: '" /tmp/forja-tooltip-ui.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/styles.css?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-estilos.css
          for escuela in arcana demonologia divina elemental naturaleza nigromancia; do
            grep -Fq ".info-escuela-${escuela}" /tmp/forja-estilos.css
          done
          # La web pública debe servir exactamente la nueva piel editorial,
          # no una hoja antigua de Pages con el resto del paquete actualizado.
          grep -Fq "fonts.googleapis.com/css2?family=Exo" /tmp/forja-estilos.css
          grep -Fq -- "--fondo:#f3f8fc" /tmp/forja-estilos.css
          grep -Fq "html[data-tema=clasico] .ficha-emergente" /tmp/forja-estilos.css
          grep -Fq ".bloque-ficha ul.lista-dos-columnas" /tmp/forja-estilos.css
          grep -Fq ".dialogo-compras{" /tmp/forja-estilos.css
          grep -Fq ".info-tabla-conjuro{" /tmp/forja-estilos.css
          grep -Fq ".recursos.recursos-rejilla{" /tmp/forja-estilos.css
          grep -Fq ".dialogo-configuracion{" /tmp/forja-estilos.css
          grep -Fq ".info-primarios.info-primarios-objeto{" /tmp/forja-estilos.css
          ! grep -Fq 'nth-child(5):last-child{grid-column:1/-1}' /tmp/forja-estilos.css
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr))' /tmp/forja-estilos.css
          grep -Fq ".protecciones-activas{" /tmp/forja-estilos.css
          grep -Fq ".info-escuela-arcana{background:LightSkyBlue" /tmp/forja-estilos.css
          grep -Fq ".info-categoria-objeto-armas{background:#ffa280" /tmp/forja-estilos.css
          echo "OK: identidad Exo, azul del blog y categorías DRS en el CSS público."

          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/data/glosas-talentos-drs.json?forja_release=${GITHUB_RUN_ID}" -o /tmp/glosas-talentos-drs.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const j=require('/tmp/glosas-talentos-drs.json');
          const cinco=new Set(['Acción','Especial','Mejora','Pasiva','Reacción']);
          assert.equal(j.registros.length,24);
          assert.equal(j.registros.filter(x=>x.tipo_origen==='Especie').length,15);
          assert.equal(j.registros.filter(x=>x.tipo_origen==='Ocupación').length,9);
          assert.deepEqual(new Set(j.registros.map(x=>x.categoria)),cinco);
          assert.ok(j.registros.every(x=>x.fuente_categoria&&cinco.has(x.categoria)&&
            !('uso_editorial' in x)&&!('resumen_editorial' in x)));
          const salvese=j.registros.find(x=>x.id_talento==='talento-drs-especie-mediano-amable-salvese-quien-pueda');
          assert.equal(salvese.categoria,'Reacción');
          const corpulencia=j.registros.find(x=>x.id_talento==='talento-drs-especie-enano-montanes-corpulencia');
          assert.equal(corpulencia.categoria,'Mejora');
          console.log('OK: categorías Excel con procedencia y sin glosas duplicadas.');
          NODE
          for par in 'tecnicas-drs-literales.json:10' 'glosas-talentos-drs.json:24' 'glosas-equipo-drs.json:111'; do
            archivo="${par%%:*}"
            total="${par##*:}"
            curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/data/${archivo}?forja_release=${GITHUB_RUN_ID}" -o "/tmp/${archivo}"
            node -e "const j=require('/tmp/${archivo}'); if(j.registros.length!==Number('${total}')) process.exit(1)"
          done

          # Los cuatro textos de varitas se sirven sin marcas metatextuales.
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const d=require('/tmp/glosas-equipo-drs.json');
          const names=new Set(['Varita de cerezo','Rama de cristal','Cetro de dracólita','Esceptro de sangreluna']);
          const varitas=d.registros.filter(x=>names.has(x.nombre));
          assert.equal(varitas.length,4);
          for(const v of varitas){
            assert.match(v.descripcion_editorial,/Tirada de Mente/);
            assert.doesNotMatch(v.descripcion_editorial,/según el DRS|descripción contextual|texto nuevo/i);
          }
          console.log('OK: cuatro varitas descriptivas y sin metatexto visible.');
          NODE
          grep -Fq 'data/tecnicas-drs-literales.json' /tmp/forja-app.js
          grep -Fq 'data/glosas-talentos-drs.json' /tmp/forja-app.js
          grep -Fq 'data/glosas-equipo-drs.json' /tmp/forja-app.js
          curl -fsSL "${PAGE_URL%/}/assets/icons-forja.svg" -o /tmp/forja-icons.svg
          test "$(grep -c '<symbol id=' /tmp/forja-icons.svg)" -eq 34
          grep -Fq 'id="recurso-blindaje"' /tmp/forja-icons.svg
          grep -Fq 'id="recurso-salud"' /tmp/forja-icons.svg
          curl -fsSL "${PAGE_URL%/}/data/especies.json" -o /tmp/forja-especies.json
          node -e "const e=require('/tmp/forja-especies.json');if(Object.keys(e).length!==8)process.exit(1)"
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/data/aclaraciones-talentos-drs.json?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-aclaraciones.json
          node -e "const a=require('/tmp/forja-aclaraciones.json');const ids=a.registros.map(x=>x.id_talento).sort();const expected=['talento-drs-especie-mediano-amable-salvese-quien-pueda','talento-drs-ocupacion-clerigo-expulsar-muertos-vivientes'].sort();if(a.estado!=='aprobacion_autoral'||JSON.stringify(ids)!==JSON.stringify(expected))process.exit(1)"
          echo "OK: Forja DRS completa en vivo, 10 Técnicas, 24 Talentos, 111 descripciones, 8 Especies, 34 SVG, dos aclaraciones y CiFi/Nocturna excluidos."
