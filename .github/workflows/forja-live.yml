name: Forja LIVE — publicación segura DRS

# Publicar solo el SHA de aplicación auditado. El workflow puede evolucionar
# sin convertir el árbol de desarrollo ni contenidos CiFi/Nocturna en LIVE.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forja-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperar snapshot consolidado aprobado de La Forja
        uses: actions/checkout@v4
        with:
          ref: 82541b4c4729267a3e5ab31a69c0a75f86857929
          persist-credentials: false
      - name: Verificar SHA exacto, Hub y las cuatro mejoras
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "82541b4c4729267a3e5ab31a69c0a75f86857929"
          grep -Fq 'href="characters/"' index.html
          grep -Fq 'href="spells/"' index.html
          grep -Fq 'id="criaturas-crear-ya"' characters/index.html
          grep -Fq 'id="criaturas-crear-aleatorio"' characters/index.html
          grep -Fq 'id="criaturas-crear-manual"' characters/index.html
          ! grep -Fq 'La tabla de progreso no añade Conjuros al repertorio' spells/index.html
          grep -Fq 'for(var siguiente=indice+1;siguiente<progresion.niveles.length;siguiente++)' assets/spell-lists-simple.js
          grep -Fq 'margin-inline:auto;justify-content:center' assets/portal.css
          test ! -e assets/icons-forja.svg
          test -s data/conjuros-drs-fichas.json
          test -s data/progresiones-oficiales.json
          test -s data/adversarios-drs.json
      - name: Preparar Node y librerías de pruebas
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar herramientas de prueba y PDF A5 (solo en runner)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1 \
            @expo-google-fonts/source-serif-4@0.4.1 playwright@1.56.1
          node scripts/preparar-vendor-pdf-a5.cjs
          npx playwright install --with-deps firefox webkit
      - name: Regresiones funcionales, DRS y Conjuros
        run: |
          node tests/alcance-drs.js
          node tests/smoke.js
          node tests/fase5-rutas-drs.js
          node tests/fase7-visuales.js
          node tests/fase7-filtros.js
          node tests/fase7-presets.js
          node tests/fase7-progresion.js
          node tests/fase7-exportacion.js
          node tests/semillas-rangos.js
          node tests/criaturas-generador.js
          node tests/criaturas-ui.js
          node tests/adversarios-drs.js
          node tests/adversarios-pdf.js
          node tests/iconos-forja.js
          node tests/pdf-a5-real.cjs
      - name: Construir exclusivamente la distribución pública autorizada
        run: |
          node scripts/crear-paquete-drs.js
          node scripts/comprobar-publicacion-drs.js dist/public-drs
          node tests/paquete-publico-drs.js
          test -s dist/public-drs/index.html
          test -s dist/public-drs/characters/index.html
          test -s dist/public-drs/spells/index.html
          test ! -e dist/public-drs/control.html
          test ! -e dist/public-drs/data/especies_cifi.json
      - name: Verificar Chrome, Firefox y WebKit sobre el paquete que se publica
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: |
          node tests/browser-compras.js
          node tests/browser-semillas-rangos.cjs chrome
          node tests/browser-criaturas.cjs chrome
          node tests/browser-enlaces-modulares.cjs chrome
          node tests/browser-enlaces-modulares.cjs firefox webkit
          node tests/pdf-a5-browser-e2e.cjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir solo dist/public-drs
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public-drs
          name: github-pages-\${{ github.run_attempt }}
      - name: Publicar La Forja LIVE
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-\${{ github.run_attempt }}
      - name: Verificar Hub, Generar ya y Conjuros en la URL pública
        env:
          PAGE_URL: \${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          raiz="\${PAGE_URL%/}"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 \
            "\${raiz}/?forja_release=82541b4c4729267a3e5ab31a69c0a75f86857929" -o /tmp/forja-live-hub.html
          grep -Fq 'href="characters/"' /tmp/forja-live-hub.html
          grep -Fq 'href="spells/"' /tmp/forja-live-hub.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 \
            "\${raiz}/characters/?forja_release=82541b4c4729267a3e5ab31a69c0a75f86857929" -o /tmp/forja-live-characters.html
          grep -Fq 'id="criaturas-crear-ya"' /tmp/forja-live-characters.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 \
            "\${raiz}/spells/?forja_release=82541b4c4729267a3e5ab31a69c0a75f86857929" -o /tmp/forja-live-spells.html
          grep -Fq 'id="tabla-progreso"' /tmp/forja-live-spells.html
          ! grep -Fq 'La tabla de progreso no añade Conjuros al repertorio' /tmp/forja-live-spells.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 \
            "\${raiz}/assets/spell-lists-simple.js?forja_release=82541b4c4729267a3e5ab31a69c0a75f86857929" -o /tmp/forja-live-progress.js
          grep -Fq 'for(var siguiente=indice+1;siguiente<progresion.niveles.length;siguiente++)' /tmp/forja-live-progress.js
          echo "OK: Hub, adversarios y Conjuros sirven la nueva revisión en LIVE."
