name: Forja LIVE — publicación segura DRS

# El punto de publicación se conserva en main. El código de Forja se
# promueve únicamente mediante un SHA revisado y probado: NO se despliega
# el árbol ni las fuentes inéditas del repositorio.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forja-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener snapshot DRS aprobado PR #76: reproducción desde cada ficha
        uses: actions/checkout@v4
        with:
          ref: 1359d878a4fdb3012e09b3da3be6d7aaa3b4e065
          persist-credentials: false
      - name: Comprobar la revisión exacta de la entrega
        run: |
          test "$(git rev-parse HEAD)" = "1359d878a4fdb3012e09b3da3be6d7aaa3b4e065"
      # Snapshot aprobado para LIVE: PR #76 con 35 SVG, dos logos WebP, PDF A5,
      # Nivel por intervalo, tema Violeta y reproducción por ficha, sin recuadro fijo.
      # Se conserva el catálogo DRS y la economía autorizados; no se publica DLC.
      # No incluye CiFi ni Nocturna y solo distribuye dist/public-drs.
      # Nunca se distribuye el árbol completo: únicamente dist/public-drs.
      - name: Auditar iconografia y funcionalidades fijadas
        shell: bash
        run: |
          set -euo pipefail
          test ! -e assets/icons-forja.svg
          test "$(find assets/icons -maxdepth 1 -name '*.svg' -type f | wc -l)" -eq 35
          test "$(find assets/icons -maxdepth 1 -name '*.webp' -type f | wc -l)" -eq 2
          for logo in sistema-nd20-faep.webp sistema-dh.webp; do
            test -s "assets/icons/$logo"
            test "$(head -c 4 "assets/icons/$logo")" = "RIFF"
            test "$(dd if="assets/icons/$logo" bs=1 skip=8 count=4 status=none)" = "WEBP"
            grep -Fq "src=\"assets/icons/$logo\"" index.html
          done
          grep -Fq 'Creador de personajes para Naufragio d20.' index.html
          grep -Fq "items.push(['Daño',dano.valor])" assets/app.js
          grep -Fq 'EFECTOS DOCUMENTADOS DE CONJUROS Y PODERES' assets/pdf-export-v2.js
          test -f assets/icons/CREDITOS-GAME-ICONS.txt
          grep -Fq 'CC BY 3.0' assets/icons/CREDITOS-GAME-ICONS.txt
          grep -Fq 'goblin-head.svg' assets/icons/CREDITOS-GAME-ICONS.txt
          # Verificar la composicion exacta y la seleccion editorial de PR #50.
          test "$(grep -l 'Icono original de Naufragio d20 aprobado' assets/icons/*.svg | wc -l)" -eq 7
          test "$(grep -l 'Game-icons.net' assets/icons/*.svg | wc -l)" -eq 28
          grep -Fq '28 son adaptaciones SVG' assets/icons/CREDITOS-GAME-ICONS.txt
          grep -Fq '7 son diseños originales' assets/icons/CREDITOS-GAME-ICONS.txt
          grep -Fq 'big-gear' assets/icons/esp-gnomo.svg
          grep -Fq 'baby-face' assets/icons/esp-mediano.svg
          grep -Fq 'pointy-hat' assets/icons/ocu-mago.svg
          grep -Fq 'axe-sword' assets/icons/ocu-guerrero.svg
          grep -Fq 'robin-hood-hat' assets/icons/ocu-ladron.svg
          grep -Fq 'pope-crown' assets/icons/ocu-clerigo.svg
          grep -Fq 'mitad-orco' assets/icons/esp-semiorco.svg
          grep -Fq 'mitad-humano' assets/icons/esp-semiorco.svg
          ! grep -Fq 'icons-forja.svg' assets/app.js
          ! grep -Fq 'icons-forja.svg' index.html
          grep -Fq "fonts.googleapis.com/css2?family=Exo" assets/styles.css
          grep -Fq "dialogo.showModal();" assets/app.js
          grep -Fq 'id="compras-grupo"' index.html
          grep -Fq "if(contiene(c.utiles_fantasia?.monturas))return 'equipo-caballo';" assets/app.js
          grep -Fq 'par[0]==="monturas"?"Montura"' assets/tooltips.js
          ! grep -Fq 'Forma del generador histórico de nombres de Ylat.' assets/rules.js
          ! grep -Fq 'Nombre del banco histórico sin clasificación documental de sexo;' assets/sex.js
          grep -Fq "grupo==='talento'||grupo==='poder'||grupo==='equipo'" assets/app.js
          # Archivo documental íntegro; la generación usa el nuevo banco independiente.
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const nombres=require('./data/tesauro-ylat.json').entradas;
          assert.equal(nombres.length,295);
          assert.equal(nombres.filter(x=>x.tipo==='documentado').length,262);
          assert.equal(nombres.filter(x=>x.tipo==='combinado').length,33);
          assert.equal(new Set(nombres.map(x=>x.nombre)).size,295);
          NODE
          grep -Fq '<option value="generico">Nombres genéricos</option>' index.html
          grep -Fq '<option value="ylat">Nombres de Ylat</option>' index.html
          ! grep -Fq 'id="buscar-nombre-ylat"' index.html
          ! grep -Fq 'id="ambito-nombre"' index.html
          ! grep -Fq '<option value="combinado"' index.html
          ! grep -Fq '<option value="documentado"' index.html
          grep -Fq 'assets/names.js' index.html
          grep -Fq 'componentesYlat' assets/app.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const c=require('./data/componentes-nombres-ylat.json');
          assert.equal(c.nombres.length,255);
          assert.equal(c.apellidos.length,133);
          for(const apellido of ['Shadelgast','Bronnhum','Boll'])
            assert.equal(c.apellidos.find(x=>x.nombre===apellido).peso_relativo,1);
          NODE
          grep -Fq 'exportar-pdf-ficha' assets/app.js
          ! grep -Eiq 'niguac|niguaz' data/tesauro-ylat.json
          ! grep -Eiq 'niguac|niguaz' index.html
          ! grep -Eiq 'niguac|niguaz' assets/rules.js
          grep -Fq 'Cambió el repertorio onomástico de Ylat' scripts/crear-paquete-drs.js
          grep -Fq 'function bloquesConjuroDRS(ficha)' assets/tooltips.js
          grep -Fq 'bloques_conjuro' assets/tooltip-ui.js
          grep -Fq '.info-tabla-conjuro{' assets/styles.css
          grep -Fq 'if(x.blindaje!=null)' assets/tooltips.js
          grep -Fq 'info.danioCompuesto?.dados_base' assets/tooltips.js
          grep -Fq '"blindaje": "d4"' data/equipo-inicial.json
          grep -Fq 'function blindajeFicha(personaje,catalogo)' assets/equipment.js
          # Entrega PR #59/#60: controles funcionales del DRS, sin venta de regalos.
          grep -Fq 'id="editor-armamento"' index.html
          grep -Fq 'class="gestionar-equipo"' assets/app.js
          grep -Fq 'function intercambiarEquipoInicial(' assets/equipment.js
          grep -Fq 'function comprarArmamentoFantasia(' assets/equipment.js
          grep -Fq 'compras_iniciales_intercambiables' assets/rules.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const e=require('./data/equipo-inicial.json');
          const dardo=e.armas.find(x=>x.nombre==='Dardo');
          assert.equal(dardo.precio,0.05);
          assert.equal(dardo.precio_editorial,'5 mc');
          assert.equal(e.componentes_paquetes_editoriales.length,5);
          assert.equal(e.utiles_fantasia.equipo_monturas.find(x=>
            x.nombre==='Armadura equina').regla_precio_autoral.multiplicador,4);
          NODE
          grep -Fq 'class="recursos recursos-rejilla' assets/app.js
          grep -Fq 'function iconoEquipo(nombre)' assets/app.js
          grep -Fq 'function descripcionConSexo(personaje)' assets/app.js
          grep -Fq 'function nombreEquipoVisible(nombre)' assets/app.js
          grep -Fq "var ordenAtributos=['Fuerza','Mente','Agilidad','Intuición','Resistencia','Presencia'];" assets/app.js
          grep -Fq "iluminacion:'Iluminación'" assets/app.js
          grep -Fq "ropa:'Ropa'" assets/app.js
          grep -Fq 'function claveEquipoDRS(nombre)' assets/tooltips.js
          grep -Fq '"id": "ropa-disfraz"' data/equipo-inicial.json
          grep -Fq '"id": "ropa-tunica"' data/equipo-inicial.json
          grep -Fq '"id": "montura-armadura-equina"' data/equipo-inicial.json
          grep -Fq '"id": "vehiculo-diligencia"' data/equipo-inicial.json
          grep -Fq '"libro de conjuros en blanco":"libro de conjuros"' assets/tooltips.js
          grep -Fq 'return !x.servicio_por_dia&&' assets/app.js
          grep -Fq '"id": "iluminacion-antorcha"' data/equipo-inicial.json
          grep -Fq 'id="dialogo-configuracion"' index.html
          grep -Fq 'id="abrir-configuracion"' index.html
          grep -Fq 'id="nivel-min"' index.html
          grep -Fq 'id="nivel-max"' index.html
          grep -Fq 'id="copiar-semilla"' index.html
          grep -Fq 'id="dialogo-reproduccion"' index.html
          grep -Fq 'id="cerrar-reproduccion"' index.html
          grep -Fq 'aria-label="Reproducción de la ficha"' index.html
          ! grep -Fq 'aria-label="Reproducción de la generación" hidden' index.html
          grep -Fq 'id="usar-semilla"' index.html
          grep -Fq 'id="estado-uso-semilla"' index.html
          grep -Fq 'id="copiar-reproduccion"' index.html
          grep -Fq 'id="ocultar-tutorial"' index.html
          grep -Fq "html[data-tema=violeta]" assets/styles.css
          grep -Fq 'var usarSemilla = false;' assets/app.js
          grep -Fq 'var semillaUsada=semillaGeneracion()' assets/app.js
          grep -Fq 'var registroGeneracion=mostrarReproduccion(semillaUsada,c);' assets/app.js
          grep -Fq 'var registroPersonalizado=mostrarReproduccion(semillaUsada,c);' assets/app.js
          grep -Fq 'function abrirReproduccion(entrada)' assets/app.js
          grep -Fq 'class="ver-reproduccion"' assets/app.js
          grep -Fq 'function actualizarUsoSemilla()' assets/app.js
          grep -Fq 'reglas.nivelAleatorio(c.nivelMin,c.nivelMax,r' assets/app.js
          grep -Fq "recurso-nota-escudo" assets/app.js
          grep -Fq "info-primarios-objeto" assets/tooltip-ui.js
          ! grep -Fq 'nth-child(5):last-child{grid-column:1/-1}' assets/styles.css
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr))' assets/styles.css
          grep -Fq 'function htmlProteccionesEquipadas(personaje,id)' assets/app.js
          echo "OK: estadísticas oficiales, 64 Conjuros, Recursos y protecciones cotejados por hash."
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar bibliotecas PDF A5 locales y licencias antes de empaquetar
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1 \
            @expo-google-fonts/source-serif-4@0.4.1 playwright@1.56.1
          node scripts/preparar-vendor-pdf-a5.cjs
          node tests/pdf-a5-real.cjs
          node tests/pdf-a5-etiquetas.js
          node tests/pdf-a5-integracion.js
          node tests/pdf-a5-editorial.js
      - name: Regresión editorial de nombres y esquema DRS
        run: |
          node tests/alcance-drs.js
          node tests/armamento-edicion.js
          node tests/limites-compra-ux.js
          node tests/elecciones-poscreacion.js
          node tests/smoke.js
          node tests/semillas-rangos.js
          node tests/fichas-drs-ux.js
          node tests/iconos-forja.js
      - name: Generar solo la carpeta DRS autorizada
        run: node scripts/crear-paquete-drs.js
      - name: Detener la publicación ante DLC o sistemas no autorizados
        run: node scripts/comprobar-publicacion-drs.js dist/public-drs
      - name: Auditar la distribución y sus textos de reglas
        run: node tests/paquete-publico-drs.js
      - name: Exportación A5 en Chrome sobre el paquete público DRS
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/pdf-a5-browser-e2e.cjs
      - name: Verificar interacción real de Chrome y semillas/rangos en paquete público
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: |
          node tests/browser-compras.js
          node tests/browser-semillas-rangos.cjs chrome
      - name: Preparar Firefox y WebKit conservando pdf-lib y fontkit
        run: |
          test -f node_modules/playwright/package.json
          npx playwright install --with-deps firefox webkit
      - name: Verificar la distribución en Firefox y WebKit (incluidos rangos y reproducción)
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: |
          node tests/browser-compatibilidad.js
          node tests/browser-semillas-rangos.cjs firefox webkit
      - name: Exportación PDF A5 en Firefox y WebKit públicos
        env:
          FORJA_PUBLIC_ROOT: dist/public-drs
        run: node tests/pdf-a5-multimotor.cjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir exclusivamente el paquete depurado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public-drs
          # Nombre distinto en reintentos del mismo run para evitar colisiones.
          name: github-pages-${{ github.run_attempt }}
      - name: Publicar Forja LIVE
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verificar el sitio público tras el despliegue
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Pages/CDN puede devolver 503 mientras propaga activos; repetir
          # solo descargas transitorias, sin relajar ninguna aserción.
          curl() { command curl --retry 4 --retry-delay 2 --retry-connrefused "$@"; }
          test -n "$PAGE_URL"
          echo "Comprobando que Pages sirve la consulta DRS compacta desde SHA fijado"
          # Verificar también la exportación A5 y su cadena de recursos sin CDN.
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/pdf-export-browser.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-pdf-browser.js
          grep -Fq 'NaufragioPdfBrowser' /tmp/forja-pdf-browser.js
          grep -Fq 'rasterizarIcono' /tmp/forja-pdf-browser.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/pdf-export-v2.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-pdf-engine.js
          grep -Fq 'function prepararDatos' /tmp/forja-pdf-engine.js
          grep -Fq 'detalleEquipo' /tmp/forja-pdf-engine.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/pdf-a5/forja-fantasia-epica-a5.pdf?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-plantilla-a5.pdf
          test "$(head -c 5 /tmp/forja-plantilla-a5.pdf)" = '%PDF-'
          for activo in assets/vendor/pdf-lib.min.js assets/vendor/fontkit.umd.min.js assets/pdf-a5/SourceSerif4_400Regular.ttf assets/pdf-a5/OFL-SourceSerif4.txt; do
            curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/${activo}?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-recurso-pdf-a5
            test -s /tmp/forja-recurso-pdf-a5
          done
          correcto=false
          for intento in $(seq 1 16); do
            if curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL}?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-live.html &&
               grep -Fq 'id="selector-visual-especie"' /tmp/forja-live.html &&
               grep -Fq 'id="generar-flotante"' /tmp/forja-live.html &&
               grep -Fq 'id="dialogo-configuracion"' /tmp/forja-live.html &&
               grep -Fq 'id="abrir-configuracion"' /tmp/forja-live.html &&
               grep -Fq 'id="nivel-min"' /tmp/forja-live.html &&
               grep -Fq 'id="nivel-max"' /tmp/forja-live.html &&
               grep -Fq 'id="copiar-semilla"' /tmp/forja-live.html &&
               grep -Fq 'id="dialogo-reproduccion"' /tmp/forja-live.html &&
               grep -Fq 'id="cerrar-reproduccion"' /tmp/forja-live.html &&
               grep -Fq 'aria-label="Reproducción de la ficha"' /tmp/forja-live.html &&
               grep -Fq 'id="usar-semilla"' /tmp/forja-live.html &&
               grep -Fq 'id="estado-uso-semilla"' /tmp/forja-live.html &&
               grep -Fq 'id="copiar-reproduccion"' /tmp/forja-live.html &&
               grep -Fq 'id="ocultar-tutorial"' /tmp/forja-live.html &&
               grep -Fq 'id="informacion-avanzada"' /tmp/forja-live.html &&
               grep -Fq 'id="inicio-movil"' /tmp/forja-live.html &&
               grep -Fq 'assets/icons/sistema-nd20-faep.webp' /tmp/forja-live.html &&
               grep -Fq 'assets/icons/sistema-dh.webp' /tmp/forja-live.html &&
               grep -Fq 'Creador de personajes para Naufragio d20.' /tmp/forja-live.html &&
               grep -Fq 'class="empezar-forja"' /tmp/forja-live.html &&
               grep -Fq '<option value="generico">Nombres genéricos</option>' /tmp/forja-live.html &&
               grep -Fq '<option value="ylat">Nombres de Ylat</option>' /tmp/forja-live.html; then
              correcto=true
              break
            fi
            sleep 5
          done
          test "$correcto" = true
          for logo in sistema-nd20-faep.webp sistema-dh.webp; do
            curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/icons/${logo}?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-logo-webp
            test "$(head -c 4 /tmp/forja-logo-webp)" = "RIFF"
            test "$(dd if=/tmp/forja-logo-webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          done
          ! grep -Fq 'data-juego="nd20_cifi"' /tmp/forja-live.html
          ! grep -Fq 'data-juego="nd20_nocturna"' /tmp/forja-live.html
          grep -Fq '<dialog id="editor-compras"' /tmp/forja-live.html
          grep -Fq 'id="editor-armamento"' /tmp/forja-live.html
          grep -Fq 'id="armamento-modo"' /tmp/forja-live.html
          grep -Fq 'id="compras-grupo"' /tmp/forja-live.html
          ! grep -Eiq 'niguac|niguaz' /tmp/forja-live.html
          ! grep -Fq '<option value="documentado"' /tmp/forja-live.html
          ! grep -Fq '<option value="combinado"' /tmp/forja-live.html
          ! grep -Fq 'id="buscar-nombre-ylat"' /tmp/forja-live.html
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/data/tesauro-ylat.json?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-ylat-live.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {entradas}=require('/tmp/forja-ylat-live.json');
          assert.equal(entradas.filter(x=>x.tipo==='documentado').length,262);
          assert.equal(entradas.filter(x=>x.tipo==='combinado').length,33);
          assert.equal(entradas.length,295);
          NODE
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/app.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-app.js
          # El CTA también se ofrece cuando la mesa no contiene fichas.
          grep -Fq "var mesaVacia=entradas.length===0;" /tmp/forja-app.js
          grep -Fq "configurador.showModal();" /tmp/forja-app.js
          grep -Fq 'function mostrarReproduccion(semilla,cfg)' /tmp/forja-app.js
          grep -Fq 'var usarSemilla = false;' /tmp/forja-app.js
          grep -Fq 'var semillaUsada=semillaGeneracion()' /tmp/forja-app.js
          grep -Fq 'var registroGeneracion=mostrarReproduccion(semillaUsada,c);' /tmp/forja-app.js
          grep -Fq 'var registroPersonalizado=mostrarReproduccion(semillaUsada,c);' /tmp/forja-app.js
          grep -Fq 'function abrirReproduccion(entrada)' /tmp/forja-app.js
          grep -Fq 'class="ver-reproduccion"' /tmp/forja-app.js
          grep -Fq 'function actualizarUsoSemilla()' /tmp/forja-app.js
          grep -Fq 'reglas.nivelAleatorio(c.nivelMin,c.nivelMax,r' /tmp/forja-app.js
          grep -Fq 'acciones-pie-ficha' /tmp/forja-app.js
          grep -Fq 'class="gestionar-equipo"' /tmp/forja-app.js
          grep -Fq 'componentesYlat' /tmp/forja-app.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/names.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-names.js
          grep -Fq 'function generico(banco,rng)' /tmp/forja-names.js
          grep -Fq 'function ylat(catalogo,rng)' /tmp/forja-names.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/data/componentes-nombres-ylat.json?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-componentes.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const d=require('/tmp/forja-componentes.json');
          assert.equal(d.nombres.length,255);
          assert.equal(d.apellidos.length,133);
          assert.equal(d.identidades_documentadas.length,262);
          assert.equal(d.combinaciones_previas.length,33);
          NODE
          grep -Fq 'exportar-pdf-ficha' /tmp/forja-app.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/tooltip-ui.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-tooltip-ui.js
          grep -Fq "if(a&&e.pointerType===\"mouse\"&&!fija" /tmp/forja-tooltip-ui.js

          # Comprobar funciones de PR #17 y no solo la presencia de los JSON.
          grep -Fq "var avanzada=false,pulsacionReferencia=false;" /tmp/forja-tooltip-ui.js
          grep -Fq "var categoriaVisible=talento?.categoria||objeto?.categoria;" /tmp/forja-tooltip-ui.js
          grep -Fq "tecnicos.appendChild(nota);" /tmp/forja-tooltip-ui.js
          ! grep -Fq "En pocas palabras" /tmp/forja-tooltip-ui.js
          ! grep -Fq "Tipo de uso (guía editorial)" /tmp/forja-tooltip-ui.js
          ! grep -Fq "Leer texto íntegro del DRS" /tmp/forja-tooltip-ui.js
          curl --connect-timeout 8 --max-time 15 -fsSL "${PAGE_URL%/}/assets/tooltips.js?forja_release=${GITHUB_RUN_ID}" -o /tmp/forja-tooltips.js
          grep -Fq "x.categoria_talento=g.categoria;" /tmp/forja-tooltips.js

          # Insignias nuevas en código servido, además de los 24 Talentos.
          grep -Fq "presentarEquipo:presentarEquipo" /tmp/forja-tooltips.js
